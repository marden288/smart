<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - NWU CEAT Smart Mirror</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .navbar {
            background: #800020;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 span { color: #c5a059; }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-number { font-size: 32px; font-weight: bold; color: #800020; }
        .btn {
            background: #800020;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-secondary { background: #c5a059; }
        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .section h2 { color: #800020; margin-bottom: 15px; }
        .item {
            border-left: 4px solid #800020;
            padding: 15px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }
        .item.high { border-left-color: #c5a059; background: #fff8f0; }
        .item.urgent { border-left-color: #f44336; background: #ffebee; }
        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }
        .edit-btn {
            background: #c5a059;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .close {
            float: right;
            cursor: pointer;
            font-size: 20px;
        }
        .empty { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🪞 NWU CEAT <span>Smart Mirror</span></h1>
        <div><span id="username">Loading...</span> <button class="logout-btn" onclick="logout()">Logout</button></div>
    </nav>
    <div class="container">
        <div class="stats">
            <div class="stat-card"><h3>📢 Announcements</h3><div class="stat-number" id="annCount">0</div></div>
            <div class="stat-card"><h3>📅 Events</h3><div class="stat-number" id="eventCount">0</div></div>
            <div class="stat-card"><h3>⭐ Upcoming</h3><div class="stat-number" id="upcomingCount">0</div></div>
        </div>
        <div>
            <button class="btn" onclick="openAnnouncementModal()">+ Post Announcement</button>
            <button class="btn btn-secondary" onclick="openEventModal()">+ Add Event</button>
        </div>
        <div class="section">
            <h2>📢 Announcements</h2>
            <div id="announcementsList"></div>
        </div>
        <div class="section">
            <h2>📅 Events</h2>
            <div id="eventsList"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Post Announcement</h3>
            <form id="modalForm">
                <div id="modalFields"></div>
                <button type="submit" class="btn" style="width:100%">Submit</button>
            </form>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        
        async function checkAuth() {
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if (!data.authenticated) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
                document.getElementById('username').textContent = data.user.username;
                loadData();
            } catch(e) { window.location.href = 'login.html'; }
        }
        
        async function apiFetch(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers }
            });
            if (res.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            }
            return res;
        }
        
        async function loadData() {
            try {
                const res = await apiFetch('/api/announcements');
                const data = await res.json();
                document.getElementById('annCount').textContent = data.announcements.length;
                document.getElementById('eventCount').textContent = data.events.length;
                const upcoming = data.events.filter(e => new Date(e.date) >= new Date()).length;
                document.getElementById('upcomingCount').textContent = upcoming;
                renderAnnouncements(data.announcements);
                renderEvents(data.events);
            } catch(e) { console.error(e); }
        }
        
        function renderAnnouncements(announcements) {
            const container = document.getElementById('announcementsList');
            if (announcements.length === 0) {
                container.innerHTML = '<div class="empty">No announcements yet.</div>';
                return;
            }
            container.innerHTML = announcements.map(a => `
                <div class="item ${a.priority === 'high' ? 'high' : a.priority === 'urgent' ? 'urgent' : ''}">
                    <strong>${escapeHtml(a.title)}</strong> ${a.priority === 'urgent' ? '🚨' : a.priority === 'high' ? '⚠️' : ''}
                    <p>${escapeHtml(a.content)}</p>
                    <small>📅 ${new Date(a.date).toLocaleDateString()} | By: ${a.createdBy}</small>
                    <div>
                        <button class="edit-btn" onclick="editAnnouncement(${a.id}, '${escapeHtml(a.title)}', '${escapeHtml(a.content)}')">Edit</button>
                        <button class="delete-btn" onclick="deleteAnnouncement(${a.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function renderEvents(events) {
            const container = document.getElementById('eventsList');
            if (events.length === 0) {
                container.innerHTML = '<div class="empty">No events scheduled.</div>';
                return;
            }
            const sorted = [...events].sort((a,b) => new Date(a.date) - new Date(b.date));
            container.innerHTML = sorted.map(e => `
                <div class="item">
                    <strong>${escapeHtml(e.title)}</strong>
                    <p>${escapeHtml(e.description || '')}</p>
                    <small>📅 ${new Date(e.date).toLocaleString()} | By: ${e.createdBy}</small>
                    <div><button class="delete-btn" onclick="deleteEvent(${e.id})">Delete</button></div>
                </div>
            `).join('');
        }
        
        async function createAnnouncement(title, content, priority) {
            const res = await apiFetch('/api/announcements', {
                method: 'POST',
                body: JSON.stringify({ title, content, priority })
            });
            if (res.ok) { loadData(); closeModal(); alert('Published!'); }
        }
        
        async function createEvent(title, date, description) {
            const res = await apiFetch('/api/events', {
                method: 'POST',
                body: JSON.stringify({ title, date, description })
            });
            if (res.ok) { loadData(); closeModal(); alert('Event added!'); }
        }
        
        async function deleteAnnouncement(id) {
            if (confirm('Delete this announcement?')) {
                await apiFetch(`/api/announcements/${id}`, { method: 'DELETE' });
                loadData();
            }
        }
        
        async function deleteEvent(id) {
            if (confirm('Delete this event?')) {
                await apiFetch(`/api/events/${id}`, { method: 'DELETE' });
                loadData();
            }
        }
        
        async function editAnnouncement(id, oldTitle, oldContent) {
            const newTitle = prompt('Edit title:', oldTitle);
            if (!newTitle) return;
            const newContent = prompt('Edit content:', oldContent);
            if (!newContent) return;
            await apiFetch(`/api/announcements/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ title: newTitle, content: newContent })
            });
            loadData();
        }
        
        function openAnnouncementModal() {
            document.getElementById('modalTitle').textContent = 'Post Announcement';
            document.getElementById('modalFields').innerHTML = `
                <input type="text" id="title" placeholder="Title" required>
                <textarea id="content" rows="4" placeholder="Content" required></textarea>
                <select id="priority">
                    <option value="normal">Normal</option>
                    <option value="high">High Priority</option>
                    <option value="urgent">Urgent</option>
                </select>
            `;
            document.getElementById('modal').classList.add('active');
            window.modalType = 'announcement';
        }
        
        function openEventModal() {
            document.getElementById('modalTitle').textContent = 'Add Event';
            document.getElementById('modalFields').innerHTML = `
                <input type="text" id="title" placeholder="Event Title" required>
                <input type="datetime-local" id="date" required>
                <textarea id="description" rows="3" placeholder="Description (optional)"></textarea>
            `;
            document.getElementById('modal').classList.add('active');
            window.modalType = 'event';
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        document.getElementById('modalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (window.modalType === 'announcement') {
                const title = document.getElementById('title').value;
                const content = document.getElementById('content').value;
                const priority = document.getElementById('priority').value;
                if (title && content) await createAnnouncement(title, content, priority);
            } else {
                const title = document.getElementById('title').value;
                const date = document.getElementById('date').value;
                const description = document.getElementById('description').value;
                if (title && date) await createEvent(title, date, description);
            }
        });
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        checkAuth();
    </script>
</body>
</html>
