<!DOCTYPE html>
<html>
<head>
    <title>Login - NWU CEAT Smart Mirror</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #800020 0%, #5a0015 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #800020; text-align: center; margin-bottom: 10px; }
        h1 span { color: #c5a059; }
        p { text-align: center; color: #666; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #800020;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #5a0015; }
        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        .register-link a { color: #800020; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>NWU CEAT <span>Smart Mirror</span></h1>
        <p>Administration Panel</p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <div id="error" class="error"></div>
        </form>
        <div class="register-link">
            <a href="register.html">Create New Account</a>
            <p style="font-size: 12px; margin-top: 10px;">Demo: admin / admin123</p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.error;
                }
            } catch(err) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error';
            }

        });
    </script>
</body>
</html>
